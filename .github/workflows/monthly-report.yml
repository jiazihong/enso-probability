name: monthly ENSO report

on:
  schedule:
    # 每月 8 日 02:00 UTC（NOAA 通常每月上中旬更新 ONI）
    - cron: '0 2 8 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓取最新 NOAA ONI 数据
        run: python enso_prob.py update
      - name: 自测
        run: python enso_prob.py selftest
      - name: 生成可视化报告（docs/index.html）
        run: python enso_prob.py report --out docs/index.html --no-bootstrap
      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/oni_cache.csv docs/index.html
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto: monthly ENSO report refresh"
            git push
          fi